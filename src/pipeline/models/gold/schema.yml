version: 2

models:
  
  - name: dim_audit
    description: "Bảng kiểm tra dữ liệu"
    columns:
      - name: audit_sk
        description: "Mã định danh duy nhất cho bản ghi kiểm tra"
        tests:
          - unique
          - not_null
      - name: audit_id
        description: "Mã định danh kiểm tra"
      - name: source_table
        description: "Tên bảng nguồn"
      - name: target_table
        description: "Tên bảng đích"
      - name: run_timestamp
        description: "Thời gian chạy kiểm tra"
      - name: records_processed
        description: "Số bản ghi được xử lý"
      - name: records_inserted
        description: "Số bản ghi được chèn"
      - name: records_updated
        description: "Số bản ghi được cập nhật"

  - name: dim_category
    description: "Bảng chiều danh mục sản phẩm"
    columns:
      - name: category_sk
        description: "Mã định danh duy nhất cho danh mục"
        tests:
          - unique
          - not_null
      - name: category_id
        description: "Mã danh mục"
      - name: category_name
        description: "Tên danh mục"

  - name: dim_customer
    description: "Bảng chiều thông tin khách hàng"
    columns:
      - name: customer_sk
        description: "Mã định danh duy nhất cho khách hàng"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Mã khách hàng"
      - name: customer_fname
        description: "Tên khách hàng"
      - name: customer_lname
        description: "Họ khách hàng"
      - name: customer_email
        description: "Email khách hàng"
      - name: sales_per_customer
        description: "Doanh thu trên khách hàng"
      - name: effective_date
        description: "Ngày hiệu lực của bản ghi"
      - name: expiration_date
        description: "Ngày hết hiệu lực của bản ghi"

  - name: dim_date
    description: "Bảng chiều thời gian"
    columns:
      - name: date_key
        description: "Mã định danh duy nhất cho ngày (định dạng YYYYMMDD)"
        tests:
          - unique
          - not_null
      - name: date
        description: "Ngày đầy đủ"
      - name: year
        description: "Năm"
      - name: quarter
        description: "Quý (1-4)"
      - name: quarter_name
        description: "Tên quý (Q1-Q4)"
      - name: month
        description: "Tháng (1-12)"
      - name: month_name
        description: "Tên tháng"
      - name: day
        description: "Ngày trong tháng (1-31)"
      - name: day_of_week_number
        description: "Số thứ tự ngày trong tuần (1-7)"
      - name: day_of_week_name
        description: "Tên ngày trong tuần"
      - name: is_weekend
        description: "Có phải cuối tuần không (1: có, 0: không)"
      - name: week_number
        description: "Số tuần trong năm"
      - name: day_of_year
        description: "Ngày trong năm (1-365/366)"

  - name: dim_delivery_status
    description: "Bảng chiều trạng thái giao hàng"
    columns:
      - name: delivery_status_sk
        description: "Mã định danh duy nhất cho trạng thái giao hàng"
        tests:
          - unique
          - not_null
      - name: delivery_status
        description: "Trạng thái giao hàng"

  - name: dim_geography
    description: "Bảng chiều địa lý"
    columns:
      - name: geography_sk
        description: "Mã định danh duy nhất cho địa lý"
        tests:
          - unique
          - not_null
      - name: geography_id
        description: "Mã định danh địa lý"
      - name: city
        description: "Thành phố"
      - name: state
        description: "Bang/Tỉnh"
      - name: country
        description: "Quốc gia"
      - name: region
        description: "Khu vực"
      - name: market
        description: "Thị trường"

  - name: dim_order_status
    description: "Bảng chiều trạng thái đơn hàng"
    columns:
      - name: order_status_sk
        description: "Mã định danh duy nhất cho trạng thái đơn hàng"
        tests:
          - unique
          - not_null
      - name: order_status
        description: "Trạng thái đơn hàng"

  - name: dim_payment_type
    description: "Bảng chiều loại thanh toán"
    columns:
      - name: payment_type_sk
        description: "Mã định danh duy nhất cho loại thanh toán"
        tests:
          - unique
          - not_null
      - name: payment_type
        description: "Loại thanh toán"

  - name: dim_product
    description: "Bảng chiều sản phẩm"
    columns:
      - name: product_sk
        description: "Mã định danh duy nhất cho sản phẩm"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "Mã sản phẩm"
      - name: product_name
        description: "Tên sản phẩm"
      - name: product_price
        description: "Giá gốc của sản phẩm"
      - name: product_status
        description: "Trạng thái sản phẩm (0: còn hàng, 1: hết hàng)"
      - name: category_id
        description: "Mã danh mục"
      - name: product_image
        description: "Đường dẫn hình ảnh sản phẩm"
      - name: effective_date
        description: "Ngày hiệu lực của bản ghi"
      - name: expiration_date
        description: "Ngày hết hiệu lực của bản ghi"

  - name: dim_shipping_mode
    description: "Bảng chiều phương thức vận chuyển"
    columns:
      - name: shipping_mode_sk
        description: "Mã định danh duy nhất cho phương thức vận chuyển"
        tests:
          - unique
          - not_null
      - name: shipping_mode
        description: "Phương thức vận chuyển"

  - name: dim_store
    description: "Bảng chiều cửa hàng"
    columns:
      - name: store_sk
        description: "Mã định danh duy nhất cho cửa hàng"
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Mã cửa hàng"
      - name: store_latitude
        description: "Vĩ độ của cửa hàng"
      - name: store_longitude
        description: "Kinh độ của cửa hàng"
      - name: store_street
        description: "Địa chỉ đường phố của cửa hàng"
      - name: store_city
        description: "Thành phố của cửa hàng"
      - name: store_state
        description: "Bang/Tỉnh của cửa hàng"
      - name: store_zipcode
        description: "Mã bưu chính của cửa hàng"
      - name: store_country
        description: "Quốc gia của cửa hàng"
      - name: effective_date
        description: "Ngày hiệu lực của bản ghi"
      - name: expiration_date
        description: "Ngày hết hiệu lực của bản ghi"

  - name: fact_sales
    description: "Bảng sự kiện doanh số bán hàng"
    columns:
      - name: order_item_id
        description: "Mã chi tiết đơn hàng"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Mã đơn hàng"
      - name: product_sk
        description: "Mã định danh sản phẩm"
      - name: customer_sk
        description: "Mã định danh khách hàng"
      - name: store_sk
        description: "Mã định danh cửa hàng"
      - name: order_date_key
        description: "Mã ngày đặt hàng (định dạng YYYYMMDD)"
      - name: shipping_date_key
        description: "Mã ngày vận chuyển (định dạng YYYYMMDD)"
      - name: order_status_sk
        description: "Mã trạng thái đơn hàng"
      - name: shipping_mode_sk
        description: "Mã phương thức vận chuyển"
      - name: delivery_status_sk
        description: "Mã trạng thái giao hàng"
      - name: payment_type_sk
        description: "Mã loại thanh toán"
      - name: quantity
        description: "Số lượng sản phẩm trong đơn hàng"
      - name: unit_price
        description: "Đơn giá của sản phẩm"
      - name: discount
        description: "Giá trị chiết khấu áp dụng cho sản phẩm"
      - name: total_price
        description: "Tổng giá trị đơn hàng sau chiết khấu"
      - name: sales
        description: "Tổng doanh thu của đơn hàng"
      - name: profit
        description: "Lợi nhuận từ đơn hàng"
      - name: days_for_shipping_real
        description: "Số ngày thực tế để vận chuyển"
      - name: days_for_shipment_scheduled
        description: "Số ngày dự kiến để vận chuyển"
      - name: late_delivery_risk
        description: "Nguy cơ giao hàng trễ (1: có, 0: không)"
- name: fact_clickstream
    description: "Bảng sự kiện clickstream"
    columns:
      - name: date_key
        description: "Mã ngày của sự kiện clickstream (định dạng YYYYMMDD)"
      - name: geography_key
        description: "Mã định danh địa lý của sự kiện clickstream"
      - name: category_key
        description: "Mã định danh danh mục của sự kiện clickstream"
      - name: product_key
        description: "Mã định danh sản phẩm của sự kiện clickstream"
      - name: total_events
        description: "Tổng số sự kiện clickstream"
      - name: total_add_to_cart
        description: "Tổng số hành động thêm vào giỏ hàng"