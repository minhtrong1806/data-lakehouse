services:
  postgres: # db suplly_chain
    # image: postgres:latest
    build:
      context: ./postgres
    hostname: postgres
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_USER=admin
      - POSTGRES_DB=supply_chain_db
    ports:
      - '5432:5432'
    volumes:
      - ./volumes/postgres_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d supply_chain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    hostname: rest
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=admin123
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://lakehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_JDBC_USER=admin
      - CATALOG_JDBC_PASSWORD=admin123
      - CATALOG_URI=jdbc:postgresql://postgres:5432/rest_db
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  trino: # query engine
    image: trinodb/trino:latest
    container_name: trino
    hostname: trino
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=admin123
      - AWS_REGION=us-east-1
    ports:
      - '8060:8060'
    volumes:
      - ./trino/etc:/etc/trino
    depends_on:
      - iceberg-rest
    
  spark: # compute engine
    build: 
      context: ./spark-iceberg
    container_name: spark
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=admin123
      - AWS_REGION=us-east-1
    volumes:
      - ./src:/src
      - ./spark-iceberg/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark-iceberg/conf/log4j2.properties:/opt/spark/conf/log4j2.properties
    ports:
      - 8888:8888 # Spark notebook port
      - 7077:7077 # Spark port
      - 8061:8061 # Spark master web ui port
      - 8062:8062 # Spark worker web ui port
      - 10000:10000 # Thrift ODBC/JDBC port
      - 10009:10009 # Kyuubi JDBC port
      - 18080:18080 # Spark history web ui port
      - 9083:9083 # Metastore thrift

  kafka:
    image: bitnami/kafka:latest
    hostname: kafka
    container_name: kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - 9092:9092
      - 9093:9093

  minio: # Storage
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./volumes/minio:/data
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  mc: # minio client for creating default bucket 
    image: minio/mc:latest
    container_name: mc
    hostname: mc
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=admin123
      - AWS_REGION=us-east-1
    volumes:
      - ./minio/init_minio.sh:/init_minio.sh 
    entrypoint: ["/bin/sh", "-c", "/init_minio.sh"]
    depends_on:
      minio:
        condition: service_healthy

  metabase:
    build: 
      context: ./metabase
    container_name: metabase
    hostname: metabase
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase_db
      - MB_DB_PORT=5432
      - MB_DB_USER=admin
      - MB_DB_PASS=admin123
      - MB_DB_HOST=postgres
    ports:
      - 3030:3030
    depends_on:
      postgres:
        condition: service_healthy


